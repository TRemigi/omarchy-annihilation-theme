# Annihilation — Swamp Dark (base16) x Area X
mode = "dark"

# The Shimmer: the teal refraction cutting through the brown marsh
accent = "#61A0A8"
selection = "#4D3F32"
selection_background = "#61A0A8"
selection_foreground = "#242015"
cursor = "#F1E9D0"
muted = "#5F4E41"

background = "#242015"
dark_background = "#1B1810"
darker_background = "#131109"
lighter_background = "#3A3124"

foreground = "#D2C3A4"
dark_foreground = "#B8A58C"
